name: Capture project previews

# Takes real screenshots of the live project websites listed in
# src/data/projects.js and commits them to public/projects/.
# Run it from the Actions tab whenever a project's website changes.
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - scripts/capture-previews.mjs
      - .github/workflows/capture-previews.yml

permissions:
  contents: write

concurrency:
  group: capture-previews-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install capture tools
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0 sharp@0.35.5
          npx playwright install --with-deps chromium

      - name: Capture screenshots
        run: node scripts/capture-previews.mjs

      - name: Commit updated previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/projects
          if git diff --cached --quiet; then
            echo "Previews are already up to date."
            exit 0
          fi
          git commit -m "Update project previews from live websites"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
